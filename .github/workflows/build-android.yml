name: Build Android APK
on:
  push:
    branches: [ main ]
    paths:
      - 'lib/**'
      - 'android/**'
      - 'pubspec.yaml'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.24.0'
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Generate android scaffold safely
        run: |
          flutter create tmp_app --platforms=android
          cp -r tmp_app/android ./
          rm -rf tmp_app

      - name: Patch Kotlin plugin version
        run: |
          sed -i 's/id "org.jetbrains.kotlin.android" version "[0-9.]*"/id "org.jetbrains.kotlin.android" version "2.0.20"/g' android/settings.gradle

      - name: Add INTERNET permission
        run: sed -i '/<manifest xmlns:android="http:\/\/schemas.android.com\/apk\/res\/android">/a <uses-permission android:name="android.permission.INTERNET" /><uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />' android/app/src/main/AndroidManifest.xml

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sgs-apk
          path: build/app/outputs/flutter-apk/app-release.apk
