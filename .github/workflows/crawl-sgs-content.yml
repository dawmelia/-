name: Crawl SGS Content
run-name: Crawl SGS Content ${{ github.run_number }}
on:
  workflow_dispatch:

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache crawl cache file
        uses: actions/cache@v4
        with:
          path: skill_content_cache.json
          key: ${{ runner.os }}-sgs-crawl-content-cache

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run crawlcontent.py
        run: python crawlcontent.py

      - name: Commit and push generated file
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add static/sgs_full.json
          git diff --staged --quiet || git commit -m "chore: update sgs_full.json from crawl content"
          git push
